{% extends "base.html" %}
{% block title %}Sign Up — HF Grader{% endblock %}
{% block content %}
<div class="row justify-content-center mt-4">
    <div class="col-md-6">
        <div class="card p-4">
            <h4 class="fw-bold mb-3">Create Account</h4>
            <form method="post">
                {% csrf_token %}
                {% if form.errors %}<div class="alert alert-danger">{{ form.errors }}</div>{% endif %}
                <div class="mb-3"><label class="form-label">Username</label>{{ form.username }}</div>
                <div class="mb-3"><label class="form-label">Email</label>{{ form.email }}</div>
                <div class="mb-3"><label class="form-label">Role</label>{{ form.role }}</div>
                <div class="mb-3"><label class="form-label">Password</label>{{ form.password1 }}</div>
                <div class="mb-3"><label class="form-label">Confirm Password</label>{{ form.password2 }}</div>
                <script>
                    document.querySelectorAll('input, select').forEach(el => el.classList.add('form-control'));
                </script>
                <button type="submit" class="btn btn-primary w-100">Create Account</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
